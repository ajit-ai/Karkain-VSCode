name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    # NOTE (Phase 1): unit + packaging only. VS Code integration tests land in
    # Phase 3 together with a real Karkain 1.1.0 toolchain build; no fake-green
    # integration job is included before then.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npx --yes @vscode/vsce package --no-yarn
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'
      - name: repository hygiene
        shell: bash
        run: |
          # No tracked file may be modified by the build (real dirtiness signal).
          test -z "$(git status --porcelain | grep -v '^??' || true)" || { echo 'tracked files were modified during the build'; git status --porcelain; exit 1; }
          # Build artifacts must be git-ignored, never committed.
          for p in out node_modules *.vsix; do
            git check-ignore -q "$p" || { echo "$p is not git-ignored"; exit 1; }
          done
