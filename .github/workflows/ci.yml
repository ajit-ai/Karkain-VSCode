name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration:
    # VS Code extension-host suite. Needs a real (headless) Electron, which is
    # why this is a separate job from `validate`: the unit suite needs no editor
    # process and must stay fast on every push.
    #
    # On Linux, Electron cannot start without a display, so the runner is wrapped
    # in xvfb-run. macOS/Windows need no such wrapper, so the condition keeps the
    # step uniform across the matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs-${{ matrix.os }}
          path: '**/*.log'
          if-no-files-found: ignore
      - run: npm ci
      # xvfb-run provides the virtual display Electron requires on Linux; the
      # other two OSes need no wrapper, so the prefix stays empty there.
      - name: extension-host suite
        run: ${{ runner.os == 'Linux' && 'xvfb-run --auto-servernum --server-args=-screen 0 1024x768x24' || '' }} npm run test:integration
        env:
          # Always take the portable path in CI: a locally installed VS Code
          # would not match the pinned build the suite is written against.
          KARKAIN_VSCODE_DOWNLOAD: '1'

  validate:
    # Unit + packaging on every supported OS. The VS Code integration suite runs
    # in the `integration` job above.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npx --yes @vscode/vsce package --no-yarn
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'
      - name: repository hygiene
        shell: bash
        run: |
          # No tracked file may be modified by the build (real dirtiness signal).
          test -z "$(git status --porcelain | grep -v '^??' || true)" || { echo 'tracked files were modified during the build'; git status --porcelain; exit 1; }
          # Build artifacts must be git-ignored, never committed.
          for p in out node_modules *.vsix; do
            git check-ignore -q "$p" || { echo "$p is not git-ignored"; exit 1; }
          done
